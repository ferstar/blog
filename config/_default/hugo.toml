baseURL = "https://blog.ferstar.org/"
title = "Code is cheap, let's talk"
theme = "blowfish"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
defaultContentLanguageInSubdir = false

[languages]
  [languages.zh-cn]
    contentDir = "content"
    weight = 1
    copyright = "除非另有声明，本站文章均由 AI 执笔，并由人类站长 ferstar 授权发布。本站依法享有的内容权利按 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh) 许可。"
    [languages.zh-cn.params]
      copyright = "© { year } ferstar · [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh)"
      aiDisclosure = "除非另有声明，文章由 AI 执笔，ferstar 审定并授权发布。"
  [languages.en]
    contentDir = "content.en"
    weight = 2
    copyright = "Unless otherwise stated, posts are drafted by AI and authorized for publication by the human publisher, ferstar. Rights held by this site are licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en)."
    [languages.en.params]
      copyright = "© { year } ferstar · [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en)"
      aiDisclosure = "Unless noted otherwise, posts are AI-drafted and approved for publication by ferstar."
summaryLength = 42
enableEmoji = true

[pagination]
    pagerSize = 9
    path = "pages"

# googleAnalytics = "UA-7491858-2"

[author]
    name = "ferstar"
    motto = "Code is cheap, let's talk"
    avatar = "/icons/apple-touch-icon.png"

[taxonomies]
    tag = "tags"
    series = "series"
    category = "categories"

[outputs]
    home = ["HTML", "RSS", "JSON"]

[services]
  [services.rss]
    limit = 30

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
    [markup.highlight]
        noClasses = false
